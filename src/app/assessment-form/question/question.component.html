<nz-card
  [nzTitle]="questionTitle"
  [class.invalid-question]="invalidQuestion"
  [attr.aria-invalid]="invalidQuestion"
  class="multiline-header"
  [class.range-question-card]="isRange"
  [class.required-question]="question.required"
  *ngIf="question.type !== QuestionType.NOTE; else note"
>
  <p *ngIf="question.hint" class="question-hint">{{ question.hint }}</p>
  <img *ngIf="question.image" class="question-image" [src]="question.image" [alt]="question.label" />
  <ng-container *ngIf="isRange; else standardInput">
    <app-range-question [question]="question" [answer]="answer" (answerChange)="addAnswer($event)"></app-range-question>
  </ng-container>
  <ng-template #standardInput>
  <nz-form-item>
    <nz-form-control>
      <ng-container [ngSwitch]="question.type" *ngIf="question && answer?.question">
        <ng-container *ngSwitchCase="QuestionType.TEXT">
          <textarea
            #textInput
            [attr.aria-label]="question.label"
            nz-input
            [required]="question.required"
            [(ngModel)]="answer.textValue"
            (ngModelChange)="answerGiven.next(answer)"
          ></textarea>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.DECIMAL">
          <nz-input-number
            [nzStep]="0.1"
            [required]="question.required"
            [(ngModel)]="answer.numberValue"
            (ngModelChange)="answerGiven.next(answer)"
            (keypress)="onKeyPress($event)"
          ></nz-input-number>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.INTEGER">
          <nz-input-number
            [nzStep]="1"
            [required]="question.required"
            [(ngModel)]="answer.numberValue"
            (ngModelChange)="answerGiven.next(answer)"
            (keypress)="onKeyPress($event)"
          ></nz-input-number>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.CHECKBOX">
          <label nz-checkbox [attr.aria-label]="question.label" [(ngModel)]="answer.booleanValue" (ngModelChange)="addAnswer(answer)"></label>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.DATE">
          <nz-date-picker
            [nzFormat]="dateFormat"
            [(ngModel)]="answer.dateValue"
            (ngModelChange)="answerGiven.next(answer)"
          ></nz-date-picker>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.TIME">
          <input
            #timeInput
            type="time"
            [attr.aria-label]="question.label"
            nz-input
            [value]="answer.textValue"
            (change)="answer.textValue = timeInput.value; answerGiven.next(answer)"
          />
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.DATETIME">
          <div class="row">
            <nz-date-picker
              [nzFormat]="this.dateFormat"
              [(ngModel)]="answer.dateValue"
              (ngModelChange)="answerGiven.next(answer)"
            ></nz-date-picker>
            <input
              #timeInput
              type="time"
            [attr.aria-label]="question.label"
              nz-input
              [value]="answer.textValue"
              (change)="answer.textValue = timeInput.value; answerGiven.next(answer)"
            />
          </div>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.SELECT_ONE">
          <app-select-question
            [question]="question"
            [answer]="answer"
            (answerChange)="addAnswer($event)"
          ></app-select-question>
        </ng-container>
        <ng-container *ngSwitchCase="QuestionType.SELECT_MULTIPLE">
          <app-multiselect-question
            [question]="question"
            [answer]="answer"
            (answerChange)="addAnswer($event)"
          ></app-multiselect-question>
        </ng-container>
        <ng-container *ngSwitchDefault>
          <nz-tag nzColor="warning">
            <i nz-icon nzType="exclamation-circle"></i>
            <span>unsupported question-type "{{ question.type }}"</span>
          </nz-tag>
        </ng-container>
      </ng-container>
    </nz-form-control>
  </nz-form-item>
  </ng-template>
  <p *ngIf="invalidQuestion" class="answer-error" role="alert">
    {{ (showRequiredError ? question.requiredMessage : question.constraintMessage) || ('assessmentPresentation.invalidAnswer' | translate) }}
  </p>
</nz-card>

<ng-template #questionTitle>
  {{ question.label }} <span *ngIf="question.required" class="required-mark" [attr.aria-label]="'assessmentPresentation.required' | translate">*</span>
</ng-template>


<ng-template #note>
  <nz-card>
    <div class="note">
      <i nz-icon nzType="exclamation-circle" nzSize="big"></i>
      <p>{{ question.label }}</p>
    </div>
    <p *ngIf="question.hint" class="question-hint">{{ question.hint }}</p>
    <img *ngIf="question.image" class="question-image" [src]="question.image" [alt]="question.label" />
  </nz-card>
</ng-template>
