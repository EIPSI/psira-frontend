<article *ngIf="currentScreen && !completed">
  <section class="package-header" *ngIf="shouldShowBundleHeader()">
    <div [innerHTML]="currentScreen.bundleHeaderHtml"></div>
  </section>

  <section class="head-row" *ngIf="shouldShowScreenHeader()">
    <div>
      <span class="screen-progress">{{ screenProgress() }}</span>
      <h2 *ngIf="hasHtml(currentScreen.label)">{{ currentScreen.label }}</h2>
    </div>
  </section>

  <section class="screen-copy" *ngIf="hasHtml(currentScreen.headerHtml)">
    <div [innerHTML]="currentScreen.headerHtml"></div>
  </section>

  <section class="screen-questionnaire" *ngFor="let questionnaire of currentScreen.questionnaires">
    <h3 *ngIf="shouldShowQuestionnaireTitle(questionnaire)">{{ questionnaireTitle(questionnaire) }}</h3>

    <section class="question-group" *ngFor="let group of questionnaire.questionGroups">
      <h4 class="group-title" *ngIf="group.label">{{ group.label }}</h4>
      <ng-container *ngFor="let question of group.questions">
        <app-question
          *ngIf="isVisible(questionnaire, question)"
          class="question"
          [question]="question"
          [questionnaire]="questionnaire"
        ></app-question>
      </ng-container>

      <table class="table-list" *ngFor="let unique of group.uniqueQuestions">
        <tr>
          <td></td>
          <td *ngFor="let choice of unique.choices">{{ choice.label }}</td>
        </tr>
        <tr *ngFor="let subQuestion of unique.subQuestions">
          <td>
            <h5>{{ subQuestion.label }}</h5>
          </td>
          <td colspan="100%">
            <nz-radio-group
              [(ngModel)]="mapped[mappedKey(questionnaire, subQuestion._id)]"
              (ngModelChange)="addTableAnswer(questionnaire, subQuestion._id, mapped[mappedKey(questionnaire, subQuestion._id)])"
            >
              <label *ngFor="let choice of unique.choices" nz-radio [nzValue]="choice.name"></label>
            </nz-radio-group>
          </td>
        </tr>
      </table>
    </section>
  </section>

  <section class="screen-copy" *ngIf="hasHtml(currentScreen.footerHtml)">
    <div [innerHTML]="currentScreen.footerHtml"></div>
  </section>

  <section class="package-notice" *ngIf="hasHtml(currentScreen.bundleNoticeHtml)">
    <div [innerHTML]="currentScreen.bundleNoticeHtml"></div>
  </section>

  <section class="controls">
    <button nz-button nzType="primary" [disabled]="currentScreenIdx <= 0" (click)="previous()">
      {{ translations.assessmentForm.prev | translate }}
    </button>
    <div class="nav-pills">
      <button
        *ngFor="let screen of screens; let index = index"
        nz-button
        nzShape="circle"
        nzSize="small"
        [nzType]="index === currentScreenIdx ? 'primary' : 'default'"
        (click)="goToScreen(index)"
      >
        &nbsp;
      </button>
    </div>
    <button nz-button nzType="primary" (click)="next()">
      {{
        (isLastScreen()
          ? translations.assessmentForm.completeAssessment
          : translations.assessmentForm.next
        ) | translate
      }}
    </button>
  </section>
</article>

<section class="completed-message" *ngIf="completed">
  <h1>{{ translations.assessmentForm.complete | translate }}</h1>
</section>
