<app-master-data-list [data]="data" [columns]="columns" (rowClick)="handleRowClick($event)"> </app-master-data-list>

<nz-drawer
  [nzWidth]="600"
  [nzMask]="true"
  [nzClosable]="true"
  [nzTitle]="'disclaimers.editScript' | translate"
  [nzVisible]="showCreateDisclaimer"
  [nzMaskClosable]="false"
  (nzOnClose)="closeCreatePanel()"
  nzPlacement="right"
>
  <div class="big-div">
    <label class="message-label">{{ 'tables.disclaimer.textInformation' | translate }}</label>
    <angular-editor
      class="message-editor"
      [config]="editorConfig"
      [(ngModel)]="description"
    ></angular-editor>
    <div class="buttons">
      <button class="cancel-button" nz-button nzType="default" (click)="closeCreatePanel()">{{ 'core.cancel' | translate }}</button>
      <button class="add-button" nz-button nzType="primary" (click)="updateDisclaimer()">{{ 'core.save' | translate }}</button>
    </div>
  </div>
</nz-drawer>
