<div nz-row>
  <div nz-col nzSpan="24">
    <app-table
      [loading]="isLoading"
      [showPagination]="false"
      [showCustomActions]="true"
      [showSearch]="true"
      [showCheckBoxColumn]="false"
      [listOfCustomActions]="perms.permissionsOnly([PK.SETTINGS_EDIT_ALL]) ? actions : []"
      [listOfData]="patientStatusesTable.rows"
      [listOfColumn]="patientStatusesTable.columns"
      [showButton]="perms.permissionsOnly([PK.SETTINGS_EDIT_ALL])"
      [buttonText]="'patientStatuses.createPatientStatus' | translate"
      [hasNextPage]="pageInfo?.hasNextPage"
      [hasPreviousPage]="pageInfo?.hasPreviousPage"
      (onNext)="navigatePages('next')"
      (onPrevious)="navigatePages('previous')"
      (onAction)="handleActionClick($event)"
      (onButton)="toggleCreatePanel()"
    >
    </app-table>
  </div>
</div>

<nz-drawer
  [nzMask]="true"
  [nzClosable]="true"
  [nzVisible]="showCreatePatientStatus"
  nzPlacement="right"
  [nzTitle]="panelTitle | translate"
  (nzOnClose)="closeCreatePanel()"
>
  <div nz-row>
    <div nz-col nzSpan="12" *ngIf="errors.length > 0">
      <nz-alert *ngFor="let error of errors" nzType="error" [nzDescription]="error" nzShowIcon></nz-alert>
    </div>
  </div>
  <form class="mt-3" [formGroup]="patientStatusFormGroup" (ngSubmit)="submitPatientStatusDraft()">
    <nz-form-item>
      <nz-form-label nzRequired>{{ 'forms.patientStatuses.name' | translate }}</nz-form-label>
      <nz-form-control [nzErrorTip]="'patientStatuses.nameValidation' | translate">
        <input
          class="m-b-15"
          nz-input
          formControlName="name"
          autocomplete="off"
          [placeholder]="'patientStatuses.nameDescription' | translate"
        />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>{{ 'forms.patientStatuses.description' | translate }}</nz-form-label>
      <nz-form-control>
        <input
          class="m-b-15"
          nz-input
          formControlName="description"
          [placeholder]="'patientStatuses.descriptionHelp' | translate"
        />
      </nz-form-control>
    </nz-form-item>

    <button nz-button nzType="primary" nzShape="round" class="full-width" [disabled]="patientStatusFormGroup.invalid || isLoading">
      {{ 'patientStatuses.submitPatientStatus' | translate }}
    </button>
  </form>
</nz-drawer>
