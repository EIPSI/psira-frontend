<app-master-data-list
  *ngIf="!selectedTree"
  [columns]="treeColumns"
  [data]="filteredTreeRows"
  [pageInfo]="pageInfo"
  [loading]="loading"
  [actions]="treeActions"
  (executeAction)="onTreeAction($event)"
  (rowClick)="openTree($event)"
>
  <div class="actions-left" actions-left>
    <app-master-data-search (search)="onSearch($event)"></app-master-data-search>
  </div>
  <ng-container actions-right>
    <button
      nz-button
      nzType="primary"
      nzShape="circle"
      (click)="openCreateTreeModal()"
      title="Crear árbol de motivos"
    >
      <i nz-icon nzType="plus"></i>
    </button>
  </ng-container>
</app-master-data-list>

<section *ngIf="selectedTree" class="reason-editor">
  <button nz-button nzType="secondary" (click)="backToTrees()">Volver</button>

  <div class="reason-editor-form">
    <nz-form-item>
      <nz-form-label [nzSpan]="6">Lugar</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <nz-select [(ngModel)]="treePlace" (ngModelChange)="onTreePlaceChange($event)" nzShowSearch>
          <nz-option *ngFor="let option of placeOptions" [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6">Ámbito</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <nz-select
          [(ngModel)]="treeScope"
          nzShowSearch
          [nzDisabled]="isGlobalReactivationPlace(treePlace)"
          [nzPlaceHolder]="isGlobalReactivationPlace(treePlace) ? 'Todos los usuarios' : 'Seleccionar ámbito'"
        >
          <nz-option *ngFor="let option of scopeOptions" [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6">Departamento</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <nz-select [(ngModel)]="treeDepartmentIds" nzMode="multiple" nzAllowClear nzShowSearch nzPlaceHolder="Default">
          <nz-option *ngFor="let department of departments" [nzValue]="department.id" [nzLabel]="department.name"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6">Estado</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <nz-tag nzColor="green">Activo</nz-tag>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="6">Etiqueta raíz</nz-form-label>
      <nz-form-control [nzSpan]="14">
        <input nz-input [(ngModel)]="treeLevelLabels[0]" placeholder="Motivo" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <section class="structure-header">
    <div>
      <h3>Estructura de motivos</h3>
      <p>{{ flatReasons.length }} motivos / {{ reasons.length }} motivos raíz</p>
    </div>
    <div class="toolbar">
      <button nz-button nzType="primary" [nzLoading]="saving" (click)="saveTreeSelection()">Actualizar árbol</button>
      <button nz-button (click)="openCreateReasonModal()">Agregar motivo</button>
    </div>
  </section>

  <section class="root-node">
    <div class="node-row root-row">
      <span class="drag-placeholder"></span>
      <span class="node-kind">ÁRBOL</span>
      <strong>{{ selectedTreeTitle() }}</strong>
    </div>

    <ng-container
      *ngTemplateOutlet="reasonList; context: { nodes: reasons, parent: null, level: 1 }"
    ></ng-container>
  </section>
</section>

<ng-template #reasonList let-nodes="nodes" let-parent="parent" let-level="level">
  <div
    class="node-list"
    cdkDropList
    [id]="dropListId(parent || selectedTree)"
    [cdkDropListData]="nodes"
    [cdkDropListConnectedTo]="dropListIds()"
    (cdkDropListDropped)="dropReason($event, parent)"
    [style.--level]="level"
  >
    <div class="node" *ngFor="let reason of nodes; let i = index" cdkDrag>
      <div class="node-row">
        <button type="button" nz-button nzShape="circle" class="drag-handle" cdkDragHandle>
          <i nz-icon nzType="drag"></i>
        </button>
        <span class="node-kind">{{ reasonNodeLevelLabel(parent, level) }}</span>
        <span class="reason-node-label">{{ reason.label }}</span>
        <nz-tag [nzColor]="reason.active ? 'green' : 'default'">
          {{ reason.active ? 'Activo' : 'Inactivo' }}
        </nz-tag>
        <nz-tag *ngIf="reason.isOther" nzColor="gold">Otro</nz-tag>
        <button nz-button nzSize="small" (click)="openCreateReasonModal(reason)">Agregar submotivo</button>
        <button nz-button nzSize="small" (click)="openEditReasonModal(reason)">Editar</button>
        <button nz-button nzSize="small" (click)="setReasonActive(reason, !reason.active)">
          {{ reason.active ? 'Desactivar' : 'Activar' }}
        </button>
        <button nz-button nzSize="small" nzDanger [disabled]="saving" (click)="deactivateReason(reason)">
          Eliminar
        </button>
      </div>

      <ng-container
        *ngTemplateOutlet="reasonList; context: { nodes: reason.children || [], parent: reason, level: level + 1 }"
      ></ng-container>
    </div>
  </div>
</ng-template>

<nz-modal
  [(nzVisible)]="treeModalVisible"
  [nzTitle]="editingTree ? 'Editar árbol de motivos' : 'Crear árbol de motivos'"
  [nzOkText]="editingTree ? 'Guardar' : 'Crear'"
  nzCancelText="Cancelar"
  [nzOkLoading]="saving"
  (nzOnCancel)="closeCreateTreeModal()"
  (nzOnOk)="saveTreeSelection()"
>
  <ng-container *nzModalContent>
    <div class="reason-modal-form">
      <label>
        <span>Lugar</span>
        <nz-select [(ngModel)]="treePlace" (ngModelChange)="onTreePlaceChange($event)" nzShowSearch nzPlaceHolder="Seleccionar lugar">
          <nz-option *ngFor="let option of placeOptions" [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
        </nz-select>
      </label>

      <label>
        <span>Ámbito</span>
        <nz-select
          [(ngModel)]="treeScope"
          nzShowSearch
          [nzDisabled]="isGlobalReactivationPlace(treePlace)"
          [nzPlaceHolder]="isGlobalReactivationPlace(treePlace) ? 'Todos los usuarios' : 'Seleccionar ámbito'"
        >
          <nz-option *ngFor="let option of scopeOptions" [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
        </nz-select>
      </label>

      <label>
        <span>Departamento</span>
        <nz-select [(ngModel)]="treeDepartmentIds" nzMode="multiple" nzAllowClear nzShowSearch nzPlaceHolder="Default">
          <nz-option *ngFor="let department of departments" [nzValue]="department.id" [nzLabel]="department.name"></nz-option>
        </nz-select>
      </label>

      <label>
        <span>Etiqueta raíz</span>
        <input nz-input [(ngModel)]="treeLevelLabels[0]" placeholder="Motivo" />
      </label>
    </div>
  </ng-container>
</nz-modal>

<nz-modal
  [(nzVisible)]="reasonModalVisible"
  [nzTitle]="editingReason ? 'Editar motivo' : 'Crear motivo'"
  nzOkText="Guardar"
  nzCancelText="Cancelar"
  [nzOkLoading]="saving"
  (nzOnCancel)="closeReasonModal()"
  (nzOnOk)="saveReason()"
>
  <ng-container *nzModalContent>
    <div class="reason-modal-form">
      <label>
        <span>Lugar</span>
        <input nz-input [ngModel]="placeLabel(selectedTree?.place)" disabled />
      </label>

      <label>
        <span>Ámbito</span>
        <input
          nz-input
          [ngModel]="isGlobalReactivationPlace(selectedTree?.place) ? 'Todos los usuarios' : scopeName(selectedTree?.scope)"
          disabled
        />
      </label>

      <label>
        <span>Departamento</span>
        <input nz-input [ngModel]="scopeLabel(selectedTree?.departmentId)" disabled />
      </label>

      <label>
        <span>{{ reasonEditLabel() }}</span>
        <input nz-input [(ngModel)]="label" />
      </label>

      <label>
        <span>Etiqueta de sus submotivos</span>
        <input nz-input [(ngModel)]="nextLevelLabel" placeholder="Ej. Causa, Detalle, Responsable" />
      </label>

      <label>
        <span>Depende de</span>
        <nz-select [(ngModel)]="parentId" nzAllowClear nzShowSearch>
          <nz-option
            *ngFor="let reason of flatReasons"
            [nzValue]="reason.id"
            [nzLabel]="reason.path"
            [nzDisabled]="editingReason?.id === reason.id"
          ></nz-option>
        </nz-select>
      </label>

      <label>
        <span>Orden</span>
        <input nz-input type="number" [(ngModel)]="sortOrder" />
      </label>

      <label class="reason-active">
        <span>Activo</span>
        <nz-switch [(ngModel)]="active"></nz-switch>
      </label>

      <label class="reason-active">
        <span>Otro motivo</span>
        <nz-switch [(ngModel)]="isOther"></nz-switch>
      </label>
    </div>
  </ng-container>
</nz-modal>
