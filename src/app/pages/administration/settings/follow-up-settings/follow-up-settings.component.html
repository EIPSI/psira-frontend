<nz-card [nzTitle]="'clinicalSettings.title' | translate" [nzLoading]="loading">
  <label>
    <span>{{ 'notifications.department' | translate }}</span>
    <nz-select [(ngModel)]="departmentId" (ngModelChange)="loadSettings()" style="width: 100%">
      <nz-option *ngIf="globalAccess" [nzValue]="0" [nzLabel]="'clinicalSettings.globalDefaults' | translate"></nz-option>
      <nz-option *ngFor="let department of departments" [nzValue]="department.id" [nzLabel]="department.name"></nz-option>
    </nz-select>
  </label>
  <p>{{ 'clinicalSettings.departmentScopeDescription' | translate }}</p>
  <div class="setting-form" *ngIf="settings">
    <label>
      <span>{{ 'clinicalSettings.editWindow' | translate }}
        <small>{{ 'clinicalSettings.daysFromSessionDate' | translate }}</small>
      </span>
      <input nz-input type="number" min="0" [(ngModel)]="settings.editWindowDays" />
    </label>
    <label>
      <span>{{ 'clinicalSettings.dashboardLookahead' | translate }}
        <small>{{ 'clinicalSettings.daysBeforeDashboard' | translate }}</small>
      </span>
      <input nz-input type="number" min="0" [(ngModel)]="settings.dashboardLookaheadDays" />
    </label>

    <label>
      <span>{{ 'clinicalSettings.caseManagerRoles' | translate }}</span>
      <nz-select nzMode="multiple" [(ngModel)]="patientCaseManagerRoleCodes" [nzPlaceHolder]="'clinicalSettings.caseManagerRoles' | translate">
        <nz-option *ngFor="let role of roleOptions" [nzValue]="role.value" [nzLabel]="role.label"></nz-option>
      </nz-select>
    </label>

    <label>
      <span>{{ 'clinicalSettings.supervisorRoles' | translate }}</span>
      <nz-select nzMode="multiple" [(ngModel)]="therapistSupervisorRoleCodes" [nzPlaceHolder]="'clinicalSettings.supervisorRoles' | translate">
        <nz-option *ngFor="let role of roleOptions" [nzValue]="role.value" [nzLabel]="role.label"></nz-option>
      </nz-select>
    </label>

    <button nz-button nzType="primary" [nzLoading]="saving" (click)="saveSettings()">
      {{ 'core.save' | translate }}
    </button>
  </div>
</nz-card>
