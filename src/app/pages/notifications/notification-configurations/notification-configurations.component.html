<app-master-data-list
  [columns]="columns"
  [data]="filteredConfigurations"
  [loading]="loading"
  [actions]="actions"
  (filter)="onFilter($event)"
  (executeAction)="onAction($event)"
  (rowClick)="openConfiguration($event)"
>
  <div class="actions-left" actions-left>
    <app-master-data-search (search)="onSearch($event)"></app-master-data-search>
    <button nz-button type="button" (click)="resetFilters()">Restablecer</button>
  </div>
  <ng-container actions-right>
    <button
      nz-button
      nzType="primary"
      nzShape="circle"
      routerLink="/psira/notifications/administration/new"
      title="Crear configuración"
      *ngIf="perms.permissionsOnly(PK.MANAGE_NOTIFICATIONS)"
    >
      <i nz-icon nzType="plus"></i>
    </button>
  </ng-container>
</app-master-data-list>
