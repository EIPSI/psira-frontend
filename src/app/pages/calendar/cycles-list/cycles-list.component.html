<nz-table
  #cyclesTable
  nzSize="small"
  [nzData]="cycles"
  [nzLoading]="loading"
  [nzFrontPagination]="false"
  [nzNoResult]="'Sin ciclos registrados'"
>
  <thead>
    <tr>
      <th [nzSortFn]="numberSort('cycleNumber')">Ciclo</th>
      <th [nzSortFn]="stringSort('status')">Estado</th>
      <th [nzSortFn]="dateSort('startedAt')">Inicio</th>
      <th [nzSortFn]="dateSort('finalizedAt')">Finalización</th>
      <th [nzSortFn]="numberSort('lastSessionNumber')">Última sesión</th>
      <th [nzSortFn]="reasonSort">Motivo</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cycle of cyclesTable.data">
      <td>{{ cycle.cycleNumber }}</td>
      <td>
        <nz-tag [nzColor]="statusColor(cycle.status)">{{ statusLabel(cycle.status) }}</nz-tag>
      </td>
      <td>{{ cycle.startedAt | date: 'short' }}</td>
      <td>{{ cycle.finalizedAt ? (cycle.finalizedAt | date: 'short') : '-' }}</td>
      <td>{{ cycle.lastSessionNumber || '-' }}</td>
      <td>{{ reasonLabel(cycle) }}</td>
    </tr>
  </tbody>
</nz-table>
