<app-calendar-grid
  [(selectedDate)]="selectedDate"
  [(view)]="view"
  [events]="events"
  [loading]="loading"
  (rangeChange)="loadEvents()"
  (createEvent)="openCreateEvent($event.date, $event.hour)"
  (eventClick)="openEdit($event)"
  (eventContextMenu)="openEventContextMenu($event.event, calendarEventContextMenu, $event.calendarEvent)"
  (eventDragStart)="onEventDragStart($event.event, $event.calendarEvent)"
  (eventDragOver)="allowDrop($event)"
  (eventDrop)="onDropEvent($event.event, $event.date, $event.hour)"
></app-calendar-grid>

<nz-dropdown-menu #calendarEventContextMenu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item (click)="openContextEvent()">Abrir</li>
    <li nz-menu-item *ngIf="contextEvent?.editable && contextEvent?.clinicalSessionId" (click)="duplicateContextEvent()">Duplicar</li>
    <li nz-menu-item *ngIf="contextEvent?.deletable" (click)="discardContextEvent()">
      {{ contextEvent?.type === 'ASSESSMENT' ? 'Descartar' : 'Cancelación' }}
    </li>
  </ul>
</nz-dropdown-menu>

<app-event-edit-modal
  [(visible)]="editModalVisible"
  [(startAt)]="editStartAt"
  [(endAt)]="editEndAt"
  [(sessionNumber)]="editSessionNumber"
  [(modality)]="editModality"
  [(description)]="editDescription"
  [(restructureEnabled)]="editRestructure"
  [(restructureEvery)]="editRestructureEvery"
  [(restructureUnit)]="editRestructureUnit"
  [(restructureOnDays)]="editRestructureOnDays"
  [(restructureEndMode)]="editRestructureEndMode"
  [(restructureEndDate)]="editRestructureEndDate"
  [(restructureCount)]="editRestructureCount"
  [(addSchemeIds)]="editAddSchemeIds"
  [(addSchemesPropagate)]="editAddSchemesPropagate"
  [(addSchemesApplicationMode)]="editAddSchemesApplicationMode"
  [(overwriteExistingSchemes)]="editOverwriteExistingSchemes"
  [event]="editingEvent"
  [saving]="saving"
  [modalityOptions]="modalityOptions"
  [repeatUnits]="repeatUnits"
  [weekDayOptions]="weekDayOptions"
  [schemeOptions]="sessionSchemes"
  [addSchemeApplicationModeOptions]="addSchemeApplicationModeOptions"
  [activeSchemeApplications]="activeSchemeApplications"
  (save)="saveEdit()"
  (discard)="discardEvent($event)"
  (stopScheme)="stopActiveScheme($event)"
  (durationChange)="setEditDurationMinutes($event)"
></app-event-edit-modal>

<nz-modal
  [(nzVisible)]="createEventModalVisible"
  nzTitle="Crear evento"
  [nzOkLoading]="creating"
  (nzOnCancel)="createEventModalVisible = false"
  (nzOnOk)="saveCreateEvent()"
>
  <div class="edit-form">
    <label>
      <span>Tipo</span>
      <nz-select [(ngModel)]="createType" (ngModelChange)="onCreateTypeChange($event)">
        <nz-option [nzValue]="CT.SESSION" nzLabel="Sesión de supervisión"></nz-option>
        <nz-option [nzValue]="CT.FIXED_SCHEME" nzLabel="Evaluación - esquema fijo"></nz-option>
        <nz-option [nzValue]="CT.SIMPLE_ASSESSMENT" nzLabel="Evaluación - individual"></nz-option>
      </nz-select>
    </label>

    <label>
      <span>Descripción</span>
      <input nz-input [(ngModel)]="createTitle" />
    </label>

    <label>
      <span>Supervisores</span>
      <nz-select
        [(ngModel)]="createResponsibleUserIds"
        (ngModelChange)="onResponsibleUsersChange($event)"
        nzMode="multiple"
        nzAllowClear
        nzShowSearch
        nzNotFoundContent="No hay supervisores asignados a este terapeuta."
      >
        <nz-option
          *ngFor="let supervisor of supervisorOptions"
          [nzValue]="supervisor.id"
          [nzLabel]="userLabel(supervisor)"
        ></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SESSION">
      <span>Esquemas session-based</span>
      <nz-select [(ngModel)]="createSessionSchemeIds" nzMode="multiple" nzAllowClear>
        <nz-option *ngFor="let scheme of sessionSchemes" [nzValue]="scheme.id" [nzLabel]="scheme.name"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SESSION">
      <span>Modalidad</span>
      <nz-select [(ngModel)]="createModality">
        <nz-option
          *ngFor="let option of modalityOptions"
          [nzValue]="option.value"
          [nzLabel]="option.label"
        ></nz-option>
      </nz-select>
    </label>

    <app-recurrence-form
      *ngIf="createType === CT.SESSION"
      [(enabled)]="repeatSession"
      [(every)]="repeatEvery"
      [(unit)]="repeatUnit"
      [(repeatOnDays)]="repeatOnDays"
      [(endMode)]="repeatEndMode"
      [(endDate)]="repeatEndDate"
      [(count)]="repeatCount"
      [repeatUnits]="repeatUnits"
      [weekDayOptions]="weekDayOptions"
    ></app-recurrence-form>

    <label *ngIf="createType === CT.FIXED_SCHEME">
      <span>Tipo de selección</span>
      <nz-select [(ngModel)]="fixedSchemeSelectionType" (ngModelChange)="onFixedSchemeSelectionTypeChange($event)">
        <nz-option [nzValue]="FST.SCHEME" nzLabel="Esquema fijo"></nz-option>
        <nz-option [nzValue]="FST.RANDOMIZATION" nzLabel="Randomización"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.FIXED_SCHEME && fixedSchemeSelectionType === FST.SCHEME">
      <span>Esquema fijo</span>
      <nz-select [(ngModel)]="createFixedSchemeIds" nzMode="multiple" nzShowSearch>
        <nz-option *ngFor="let scheme of fixedSchemes" [nzValue]="scheme.id" [nzLabel]="scheme.name"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.FIXED_SCHEME && fixedSchemeSelectionType === FST.RANDOMIZATION">
      <span>Randomización</span>
      <nz-select [(ngModel)]="createFixedRandomizationRuleIds" nzMode="multiple" nzShowSearch>
        <nz-option *ngFor="let randomization of highLevelRandomizations" [nzValue]="randomization.id" [nzLabel]="randomization.name"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT">
      <span>Tipo de evaluación</span>
      <nz-select [(ngModel)]="simpleAssessmentTypeId" nzShowSearch>
        <nz-option *ngFor="let type of assessmentTypes" [nzValue]="type.id" [nzLabel]="type.name"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT">
      <span>Nombre de la evaluación (opcional)</span>
      <input nz-input [(ngModel)]="simpleAssessmentName" placeholder="Si se deja vacío se usará el tipo de evaluación" />
    </label>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT">
      <span>Contenido</span>
      <nz-select [(ngModel)]="simpleContentType" (ngModelChange)="onSimpleContentTypeChange($event)">
        <nz-option [nzValue]="ACT.QUESTIONNAIRE" nzLabel="Cuestionario"></nz-option>
        <nz-option [nzValue]="ACT.QUESTIONNAIRE_BUNDLE" nzLabel="Paquete de cuestionarios"></nz-option>
        <nz-option [nzValue]="ACT.RANDOMIZATION" nzLabel="Randomización"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT && simpleContentType === ACT.QUESTIONNAIRE">
      <span>Cuestionarios</span>
      <nz-select
        [ngModel]="simpleQuestionnaireIds && simpleQuestionnaireIds[0]"
        (ngModelChange)="simpleQuestionnaireIds = $event ? [$event] : []"
        nzShowSearch
        nzServerSearch
        nzAllowClear
        nzNotFoundContent="No hay contenido disponible para los departamentos seleccionados."
        (nzOnSearch)="searchQuestionnaires($event)"
      >
        <nz-option
          *ngFor="let questionnaire of foundQuestionnaires"
          [nzValue]="questionnaire._id"
          [nzLabel]="questionnaire.name"
        ></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT && simpleContentType === ACT.QUESTIONNAIRE_BUNDLE">
      <span>Paquetes</span>
      <nz-select [ngModel]="simpleQuestionnaireBundleIds && simpleQuestionnaireBundleIds[0]" (ngModelChange)="simpleQuestionnaireBundleIds = $event ? [$event] : []" nzShowSearch nzAllowClear nzNotFoundContent="No hay contenido disponible para los departamentos seleccionados.">
        <nz-option *ngFor="let bundle of questionnaireBundles" [nzValue]="bundle._id" [nzLabel]="bundle.name"></nz-option>
      </nz-select>
    </label>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT && simpleContentType === ACT.RANDOMIZATION">
      <span>Randomización</span>
      <nz-select [ngModel]="simpleRandomizationRuleIds && simpleRandomizationRuleIds[0]" (ngModelChange)="simpleRandomizationRuleIds = $event ? [$event] : []" nzShowSearch nzAllowClear nzNotFoundContent="No hay contenido disponible para los departamentos seleccionados.">
        <nz-option *ngFor="let randomization of lowLevelRandomizations" [nzValue]="randomization.id" [nzLabel]="randomization.name"></nz-option>
      </nz-select>
    </label>

    <div class="date-row">
      <label>
        <span>Inicio</span>
        <nz-date-picker [(ngModel)]="createStartAt" nzShowTime></nz-date-picker>
      </label>
      <label *ngIf="createType === CT.SESSION">
        <span>Finalización</span>
        <nz-date-picker [(ngModel)]="createEndAt" nzShowTime></nz-date-picker>
      </label>
    </div>

    <div class="date-row" *ngIf="createType === CT.SIMPLE_ASSESSMENT">
      <label>
        <span>Vencimiento</span>
        <input nz-input type="number" min="0" [(ngModel)]="simpleAvailabilityMinutes" />
      </label>
      <label>
        <span>Unidad</span>
        <nz-select [(ngModel)]="simpleAvailabilityUnit">
          <nz-option
            *ngFor="let unit of availabilityUnits"
            [nzValue]="unit.value"
            [nzLabel]="unit.label"
          ></nz-option>
        </nz-select>
      </label>
    </div>

    <div class="date-row" *ngIf="createType === CT.SIMPLE_ASSESSMENT">
      <label>
        <span>Recordatorios después de la activación</span>
        <input nz-input [(ngModel)]="simpleReminderMinutes" placeholder="10, 15, 20" />
      </label>
      <label>
        <span>Unidad</span>
        <nz-select [(ngModel)]="simpleReminderUnit">
          <nz-option
            *ngFor="let unit of availabilityUnits"
            [nzValue]="unit.value"
            [nzLabel]="unit.label"
          ></nz-option>
        </nz-select>
      </label>
    </div>

    <label *ngIf="createType === CT.SIMPLE_ASSESSMENT">
      <span>Nota de supervisión de evaluación</span>
      <textarea nz-input [(ngModel)]="simpleAssessmentNote" rows="3"></textarea>
    </label>
  </div>
</nz-modal>

<nz-modal
  [(nzVisible)]="cancelModalVisible"
  nzTitle="Cancelación"
  [nzOkLoading]="saving"
  nzOkText="Confirmar"
  nzCancelText="Volver"
  (nzOnCancel)="cancelModalVisible = false"
  (nzOnOk)="confirmCancellation()"
>
  <ng-container *nzModalContent>
    <div class="edit-form">
      <label>
        <span>Tipo</span>
        <nz-select [ngModel]="cancelType" (ngModelChange)="onCancelTypeChange($event)">
          <nz-option nzValue="RESCHEDULED" nzLabel="Cancelación por reprogramación"></nz-option>
          <nz-option nzValue="NO_SHOW" nzLabel="Cancelación por falta"></nz-option>
        </nz-select>
      </label>

      <label
        *ngFor="let level of cancellationReasonLevels; let levelIndex = index"
        [hidden]="cancelType !== 'NO_SHOW'"
      >
        <span>{{ cancellationReasonLevelLabel(levelIndex) }}</span>
        <nz-select
          [ngModel]="selectedCancellationReasonIds[levelIndex]"
          (ngModelChange)="onCancellationReasonChange(levelIndex, $event)"
          nzAllowClear
          nzShowSearch
        >
          <nz-option
            *ngFor="let reason of level"
            [nzValue]="reason.id"
            [nzLabel]="reason.label"
          ></nz-option>
        </nz-select>
      </label>

      <label *ngIf="cancelType === 'NO_SHOW' && showCancellationOtherReason">
        <span>Otro motivo</span>
        <textarea nz-input rows="3" [(ngModel)]="cancelOtherReason"></textarea>
      </label>

      <label>
        <span>Nota de supervisión</span>
        <textarea nz-input rows="3" [(ngModel)]="cancelClinicalNote"></textarea>
      </label>

      <nz-spin [nzSpinning]="automationPreviewLoading">
        <div class="automation-preview" *ngIf="automationPreview.length">
          <h3>Automatizaciones que se aplicarán</h3>
          <label
            class="automation-preview-item"
            *ngFor="let automation of automationPreview"
            nz-checkbox
            [ngModel]="automationPreviewChecked(automation.automationId)"
            (ngModelChange)="toggleAutomationPreview(automation.automationId, $event)"
          >
            <strong>{{ automation.title }}</strong>
            <span>{{ triggerPointLabel[automation.triggerPoint] || automation.triggerPoint }} · {{ automation.resourceName }} · {{ automation.delayLabel }}</span>
          </label>
        </div>
      </nz-spin>
    </div>
  </ng-container>
</nz-modal>
