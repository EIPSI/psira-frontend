<div class="buttons">
  <button nz-button nzType="primary" (click)="goBack()">Back</button>
</div>
<div class="patient-header" *ngIf="patientTitle">
  <h1>{{ patientTitle }}</h1>
  <div class="patient-header-actions" *ngIf="patient">
    <div class="status-selector">
      <nz-select
        [ngModel]="patient.statusId"
        (ngModelChange)="changeStatus($event)"
        [nzPlaceHolder]="'tables.patients.status' | translate"
        [nzLoading]="loading"
        style="width: 200px;"
      >
        <nz-option *ngFor="let status of patientStatuses" [nzValue]="status.id" [nzLabel]="status.name"></nz-option>
      </nz-select>
      <nz-tag *ngIf="patient.formattedStatus" [nzColor]="patient.formattedStatus.color" style="margin-left: 10px;">
        {{ patient.formattedStatus.title }}
      </nz-tag>
    </div>

  </div>
</div>

<ng-template #cycleTabActions>
  <div class="cycle-tab-actions">
    <button
      nz-button
      class="cycle-tab-action cycle-tab-action-danger"
      [nzLoading]="cycleLoading"
      *ngIf="!activeTreatmentCycle || activeTreatmentCycle.status === TCS.ACTIVE || activeTreatmentCycle.status === TCS.FINALIZATION_CANCELLED"
      (click)="openFinalizeTreatment()"
    >
      Finalización de tratamiento
    </button>
    <button
      nz-button
      class="cycle-tab-action"
      *ngIf="activeTreatmentCycle?.status === TCS.FINALIZED && canUndoFinalization()"
      (click)="openCancelFinalization()"
    >
      Anular finalización
    </button>
    <button
      nz-button
      class="cycle-tab-action cycle-tab-action-primary"
      *ngIf="activeTreatmentCycle?.status === TCS.FINALIZED"
      (click)="openNewTreatment()"
    >
      Nuevo tratamiento
    </button>
  </div>
</ng-template>

<nz-tabset nzSize="large" [(nzSelectedIndex)]="selectedTabIndex" [nzTabBarExtraContent]="cycleTabActions">
  <nz-tab *ngIf="patientTitle" [nzTitle]="'core.calendar' | translate">
    <app-patient-calendar [patient]="patient"></app-patient-calendar>
  </nz-tab>
  <nz-tab *ngIf="patientTitle" nzTitle="Historia clinica">
    <app-clinical-follow-up-list
      [patientId]="patient?.id"
      [sessionKind]="CSK.CLINICAL"
      title="Historia clinica"
    ></app-clinical-follow-up-list>
  </nz-tab>
  <nz-tab *ngIf="patientTitle" [nzTitle]="'core.reports' | translate">
    <app-reports [patient]="patient"></app-reports>
  </nz-tab>
  <nz-tab *ngIf="patientTitle" nzTitle="Datos del caso">
    <nz-tabset nzSize="small">
      <nz-tab [nzTitle]="'core.profile' | translate">
        <app-create-patient></app-create-patient>
      </nz-tab>
      <nz-tab [nzTitle]="'core.caseManagers' | translate">
        <app-case-managers [managerType]="'caseManager'" [patient]="patient" [showAssignButton]="true" [filter]="filter">
        </app-case-managers>
      </nz-tab>
      <nz-tab [nzTitle]="'core.departments' | translate">
        <app-patient-departments [patient]="patient"></app-patient-departments>
      </nz-tab>
      <nz-tab [nzTitle]="'core.caregivers' | translate">
        <app-caregivers-patient [patient]="patient"></app-caregivers-patient>
      </nz-tab>
    </nz-tabset>
  </nz-tab>
  <nz-tab *ngIf="patientTitle" nzTitle="Más">
    <nz-tabset nzSize="small">
      <nz-tab [nzTitle]="'core.assessments' | translate">
        <app-assessments [patient]="patient"></app-assessments>
      </nz-tab>
      <nz-tab nzTitle="Sesiones">
        <app-sessions-list [patientId]="patient?.id"></app-sessions-list>
      </nz-tab>
      <nz-tab nzTitle="Ciclos">
        <app-cycles-list [patientId]="patient?.id" [cycleKind]="CSK.CLINICAL"></app-cycles-list>
      </nz-tab>
      <nz-tab nzTitle="Automatizaciones aplicadas">
        <app-applied-automations-list [userId]="patient?.userId"></app-applied-automations-list>
      </nz-tab>
    </nz-tabset>
  </nz-tab>
</nz-tabset>

<nz-modal
  [(nzVisible)]="finalizeModalVisible"
  nzTitle="Finalización de tratamiento"
  nzOkText="Finalizar"
  nzCancelText="Volver"
  [nzOkLoading]="cycleSaving"
  (nzOnCancel)="finalizeModalVisible = false"
  (nzOnOk)="confirmFinalizeTreatment()"
>
  <ng-container *nzModalContent>
    <div class="cycle-form">
      <label>
        <span>Última sesión</span>
        <input nz-input type="number" [(ngModel)]="finalizationLastSessionNumber" />
      </label>

      <label *ngFor="let level of finalizationReasonLevels; let levelIndex = index">
        <span>{{ finalizationReasonLevelLabel(levelIndex) }}</span>
        <nz-select
          [ngModel]="selectedFinalizationReasonIds[levelIndex]"
          (ngModelChange)="onFinalizationReasonChange(levelIndex, $event)"
          nzAllowClear
          nzShowSearch
        >
          <nz-option *ngFor="let reason of level" [nzValue]="reason.id" [nzLabel]="reason.label"></nz-option>
        </nz-select>
      </label>

      <label *ngIf="showFinalizationOtherReason">
        <span>Otro motivo</span>
        <input nz-input [(ngModel)]="finalizationOtherReason" />
      </label>

      <label>
        <span>Nota clínica</span>
        <textarea nz-input rows="4" [(ngModel)]="finalizationNote"></textarea>
      </label>
    </div>
  </ng-container>
</nz-modal>

<nz-modal
  [(nzVisible)]="cancelFinalizationModalVisible"
  nzTitle="Anular finalización"
  nzOkText="Anular"
  nzCancelText="Volver"
  [nzOkLoading]="cycleSaving"
  (nzOnCancel)="cancelFinalizationModalVisible = false"
  (nzOnOk)="confirmCancelFinalization()"
>
  <ng-container *nzModalContent>
    <label class="cycle-form">
      <span>Nota</span>
      <textarea nz-input rows="4" [(ngModel)]="cancelFinalizationNote"></textarea>
    </label>
  </ng-container>
</nz-modal>

<nz-modal
  [(nzVisible)]="newTreatmentModalVisible"
  nzTitle="Nuevo tratamiento"
  nzOkText="Iniciar"
  nzCancelText="Volver"
  [nzOkLoading]="cycleSaving"
  (nzOnCancel)="newTreatmentModalVisible = false"
  (nzOnOk)="confirmNewTreatment()"
>
  <ng-container *nzModalContent>
    <div class="cycle-form">
      <nz-alert
        *ngIf="activeTreatmentCycle?.previousCycleCount || activeTreatmentCycle?.daysSincePreviousFinalization"
        nzType="info"
        nzShowIcon
        [nzMessage]="'Ciclos previos: ' + (activeTreatmentCycle?.previousCycleCount || 0)"
        [nzDescription]="'Días desde la última finalización: ' + (activeTreatmentCycle?.daysSincePreviousFinalization || 0)"
      ></nz-alert>

      <label *ngFor="let level of newTreatmentReasonLevels; let levelIndex = index">
        <span>{{ newTreatmentReasonLevelLabel(levelIndex) }}</span>
        <nz-select
          [ngModel]="selectedNewTreatmentReasonIds[levelIndex]"
          (ngModelChange)="onNewTreatmentReasonChange(levelIndex, $event)"
          nzAllowClear
          nzShowSearch
        >
          <nz-option *ngFor="let reason of level" [nzValue]="reason.id" [nzLabel]="reason.label"></nz-option>
        </nz-select>
      </label>

      <label *ngIf="showNewTreatmentOtherReason">
        <span>Otro motivo</span>
        <input nz-input [(ngModel)]="newTreatmentOtherReason" />
      </label>

      <label>
        <span>Nota clínica</span>
        <textarea nz-input rows="4" [(ngModel)]="newTreatmentNote"></textarea>
      </label>
    </div>
  </ng-container>
</nz-modal>
