<nz-spin [nzSpinning]="loading">
  <div class="ci-page-header">
    <div>
      <h2>{{ managementId ? 'Editar gestión CI' : 'Nueva gestión CI' }}</h2>
      <p>Definí cuándo se solicita un consentimiento y a quiénes aplica.</p>
    </div>
    <div>
      <button nz-button type="button" (click)="cancel()">Cancelar</button>
      <button nz-button nzType="primary" type="button" [nzLoading]="saving" (click)="save()">Guardar</button>
    </div>
  </div>

  <form nz-form [formGroup]="form" class="ci-form">
    <nz-form-item>
      <nz-form-label nzRequired>Título</nz-form-label>
      <nz-form-control><input nz-input formControlName="title" /></nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzRequired>Modelo</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="modelId" nzShowSearch>
          <nz-option *ngFor="let model of models" [nzValue]="model.id" [nzLabel]="model.name"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzRequired>Trigger</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="trigger">
          <nz-option *ngFor="let trigger of triggers" [nzValue]="trigger" [nzLabel]="triggerLabel[trigger]"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzRequired>Estado</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="status">
          <nz-option *ngFor="let status of statuses" [nzValue]="status" [nzLabel]="statusLabel[status]"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <div class="ci-switch-row">
      <label><nz-switch formControlName="mandatory"></nz-switch> Debe responderse para continuar usando PSIRA</label>
      <label><nz-switch formControlName="active"></nz-switch> Activo</label>
    </div>
    <nz-form-item>
      <nz-form-label>Roles</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="roleIds" nzMode="multiple" nzShowSearch nzAllowClear nzPlaceHolder="Sin roles seleccionados: todos">
          <nz-option *ngFor="let role of roles" [nzValue]="role.id" [nzLabel]="role.name"></nz-option>
        </nz-select>
        <div class="ci-inline-actions">
          <button nz-button nzSize="small" type="button" (click)="selectAllRoles()">Agregar todos</button>
          <button nz-button nzSize="small" type="button" (click)="clearRoles()">Quitar todos</button>
        </div>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label>Departamentos</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="departmentIds" nzMode="multiple" nzShowSearch nzAllowClear nzPlaceHolder="Sin departamentos seleccionados: todos">
          <nz-option *ngFor="let department of departments" [nzValue]="department.id" [nzLabel]="department.name"></nz-option>
        </nz-select>
        <div class="ci-inline-actions">
          <button nz-button nzSize="small" type="button" (click)="selectAllDepartments()">Agregar todos</button>
          <button nz-button nzSize="small" type="button" (click)="clearDepartments()">Quitar todos</button>
        </div>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label>Prioridad</nz-form-label>
      <nz-form-control><input nz-input type="number" formControlName="priority" /></nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label>Descripción</nz-form-label>
      <nz-form-control><textarea nz-input rows="3" formControlName="description"></textarea></nz-form-control>
    </nz-form-item>
  </form>
</nz-spin>
