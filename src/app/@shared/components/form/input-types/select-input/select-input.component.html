<label *ngIf="showLabel">
  <b>
    <ng-container *ngIf="field.translationPath; else plainTitle">
      <span [translate]="field.translationPath"></span>
    </ng-container>
    <ng-template #plainTitle> {{ field?.title | translate }} </ng-template>
    <span style="color: red" *ngIf="field?.isRequired && inputMode"> *</span>
  </b>
  <small class="field-description" *ngIf="field.showDescription && field.description">{{ field.description | translate }}</small>
</label>
<ng-container *ngIf="inputMode">
  <nz-input-group [formGroup]="inputGroup" [ngClass]="{ 'is-disabled': field.disabled }">
    <nz-select
      style="width: 100%"
      [nzPlaceHolder]="field.description | translate"
      [formControlName]="field.name"
      [nzMode]="field.mode || 'default'"
      [nzShowSearch]="!!field.optionGroups?.length"
      [nzDisabled]="field.disabled"
      [ngClass]="{
        'has-error': inputIsValid() === false,
        'has-success': inputIsValid() === true
      }"
    >
      <ng-container *ngIf="field.optionGroups?.length; else flatOptions">
        <nz-option-group *ngFor="let group of field.optionGroups" [nzLabel]="group.label">
          <nz-option *ngFor="let option of group.options" [nzValue]="option.value" [nzLabel]="option.label | translate"></nz-option>
        </nz-option-group>
      </ng-container>
      <ng-template #flatOptions>
        <nz-option *ngFor="let option of field.options" [nzValue]="option.value" [nzLabel]="option.label | translate"></nz-option>
      </ng-template>
    </nz-select>
  </nz-input-group>
</ng-container>
<div class="field-value" *ngIf="!inputMode">
  <span>{{ getSelectedLabel() }}</span>
</div>
<p
  *ngIf="this.inputGroup.controls[this.field.name].dirty && this.inputGroup.controls[this.field.name].invalid"
  translate
>
  {{ field.validationMessage | translate }}
</p>
